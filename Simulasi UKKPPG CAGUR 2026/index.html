<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRYOUT UKPPPG CALON GURU 2026</title>
  <style>
    :root {
      --navy: #0b2545;
      --navy2: #13315c;
      --blue: #1d4e89;
      --blue2: #2f6fb3;
      --sky: #8ecae6;
      --sky2: #e8f3fb;
      --white: #ffffff;
      --gray: #f2f5f9;
      --gray2: #dde5ee;
      --text: #17263b;
      --muted: #5f7186;
      --green: #1f8a4c;
      --greenbg: #e2f5ea;
      --red: #c0392b;
      --redbg: #fdecea;
      --amber: #b8860b;
      --amberbg: #fdf3d7;
      --shadow: 0 6px 24px rgba(11, 37, 69, .10);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #eaf2fa 0%, #f7fafd 40%, #eef4fb 100%);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .hidden {
      display: none !important
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none
    }

    input,
    select {
      font-family: inherit
    }

    header.appbar {
      background: linear-gradient(90deg, var(--navy) 0%, var(--navy2) 60%, var(--blue) 100%);
      color: #fff;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: 0 3px 14px rgba(11, 37, 69, .35);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .brand .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--sky);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--navy);
      font-size: 18px;
      letter-spacing: .5px;
      flex: 0 0 auto;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .4px;
      line-height: 1.25
    }

    .brand small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #cfe2f5;
      letter-spacing: .3px
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .pill {
      background: rgba(255, 255, 255, .13);
      border: 1px solid rgba(255, 255, 255, .25);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sky)
    }

    .timer-pill {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums
    }

    .timer-pill.warn {
      background: rgba(253, 211, 77, .22);
      border-color: #fdf3d7;
      color: #ffe9a8
    }

    .timer-pill.danger {
      background: rgba(192, 57, 43, .35);
      border-color: #e88;
      color: #ffd7d2;
      animation: pulse 1s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .65
      }
    }

    .btn {
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13.5px;
      font-weight: 700;
      transition: transform .12s ease, box-shadow .12s ease, background .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      transform: translateY(1px) scale(.99)
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: #fff;
      box-shadow: 0 5px 16px rgba(29, 78, 137, .35)
    }

    .btn-primary:hover {
      box-shadow: 0 7px 22px rgba(29, 78, 137, .45)
    }

    .btn-ghost {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, .45)
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .12)
    }

    .btn-outline {
      background: #fff;
      color: var(--blue);
      border: 1.5px solid var(--blue2)
    }

    .btn-outline:hover {
      background: var(--sky2)
    }

    .btn-green {
      background: linear-gradient(135deg, #177245, #28a862);
      color: #fff;
      box-shadow: 0 5px 16px rgba(31, 138, 76, .35)
    }

    .btn-red {
      background: linear-gradient(135deg, #a93226, #d1453a);
      color: #fff;
      box-shadow: 0 5px 16px rgba(192, 57, 43, .3)
    }

    .btn-sm {
      padding: 7px 13px;
      font-size: 12px;
      border-radius: 9px
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 18px 60px
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      border: 1px solid #e7eef6;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 6px
    }

    .section-sub {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 20px
    }

    .hero {
      text-align: center;
      padding: 36px 28px 30px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 55%, var(--blue) 100%);
      color: #fff;
      box-shadow: 0 14px 40px rgba(11, 37, 69, .35);
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -80px;
      top: -80px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(142, 202, 230, .13);
    }

    .hero::before {
      content: "";
      position: absolute;
      left: -60px;
      bottom: -100px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(142, 202, 230, .09);
    }

    .hero .badge {
      display: inline-block;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .3);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: #dcecf9;
    }

    .hero h2 {
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 800;
      letter-spacing: .4px;
      line-height: 1.2;
      position: relative
    }

    .hero p.sub {
      font-size: clamp(13px, 1.7vw, 16px);
      color: #c9def2;
      margin-top: 10px;
      position: relative;
      font-weight: 500
    }

    .hero .meta-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
      position: relative;
    }

    .hero .meta-chip {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .22);
      padding: 9px 16px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 600;
      color: #e6f1fb;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero .meta-chip b {
      color: #fff
    }

    .note {
      background: var(--amberbg);
      border: 1px solid #ecd9a0;
      color: #7a5a00;
      padding: 12px 16px;
      border-radius: 11px;
      font-size: 12.5px;
      margin-top: 22px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      line-height: 1.55;
    }

    .note .ic {
      font-size: 16px;
      line-height: 1
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 7px
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--gray2);
      font-size: 14px;
      background: #fbfdff;
      transition: border .15s, box-shadow .15s;
      color: var(--text);
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--blue2);
      box-shadow: 0 0 0 3px rgba(47, 111, 179, .15);
      background: #fff
    }

    .field .hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 6px
    }

    .start-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap
    }

    .err-msg {
      color: var(--red);
      font-size: 12.5px;
      font-weight: 600;
      margin-top: 10px;
      min-height: 16px
    }

    .exam-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      align-items: start
    }

    .q-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid #e7eef6;
      overflow: hidden
    }

    .q-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 24px;
      border-bottom: 1px solid var(--gray2);
      background: linear-gradient(90deg, #f6fafe, #eef5fc);
    }

    .q-badge {
      background: var(--navy);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .6px;
      padding: 6px 13px;
      border-radius: 8px;
    }

    .q-cat {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      background: var(--sky2);
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid #cfe4f6;
      letter-spacing: .3px;
    }

    .q-body {
      padding: 26px 28px
    }

    .q-text {
      font-size: 15.5px;
      line-height: 1.65;
      color: var(--text);
      font-weight: 500;
      white-space: pre-line
    }

    .instruction {
      display: inline-block;
      margin-top: 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--amber);
      background: var(--amberbg);
      border: 1px solid #ecd9a0;
      padding: 5px 12px;
      border-radius: 8px;
      letter-spacing: .3px;
    }

    .options {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 11px
    }

    .opt {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 14px 16px;
      border-radius: 11px;
      border: 1.5px solid var(--gray2);
      background: #fbfdff;
      cursor: pointer;
      transition: border .14s, background .14s, box-shadow .14s;
    }

    .opt:hover {
      border-color: var(--sky);
      background: #f4faff
    }

    .opt.selected {
      border-color: var(--blue2);
      background: var(--sky2);
      box-shadow: 0 0 0 2px rgba(47, 111, 179, .18)
    }

    .opt .marker {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--gray2);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      background: #fff;
      transition: all .14s;
    }

    .opt.selected .marker {
      background: var(--blue2);
      border-color: var(--blue2);
      color: #fff
    }

    .opt .marker.sq {
      border-radius: 7px
    }

    .opt .opt-txt {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text);
      padding-top: 1px
    }

    .bs-row {
      display: flex;
      gap: 11px;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border: 1.5px solid var(--gray2);
      border-radius: 11px;
      background: #fbfdff;
      flex-wrap: wrap
    }

    .bs-row .stmt {
      font-size: 14px;
      flex: 1;
      min-width: 200px;
      line-height: 1.5
    }

    .bs-btns {
      display: flex;
      gap: 8px
    }

    .bs-btn {
      padding: 8px 18px;
      border-radius: 9px;
      border: 1.5px solid var(--gray2);
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      transition: all .14s
    }

    .bs-btn.on-true {
      background: var(--greenbg);
      border-color: var(--green);
      color: var(--green)
    }

    .bs-btn.on-false {
      background: var(--redbg);
      border-color: var(--red);
      color: var(--red)
    }

    .bs-btn:hover {
      border-color: var(--sky)
    }

    .q-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 24px;
      border-top: 1px solid var(--gray2);
      background: #f9fbfe;
    }

    .q-footer .left,
    .q-footer .right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .flag-btn {
      border: 1.5px solid var(--amber);
      background: #fff;
      color: var(--amber);
      font-weight: 700;
      font-size: 12.5px;
      padding: 9px 15px;
      border-radius: 9px;
      display: inline-flex;
      gap: 7px;
      align-items: center;
      transition: all .14s;
    }

    .flag-btn.active {
      background: var(--amberbg);
      box-shadow: 0 0 0 2px rgba(184, 134, 11, .18)
    }

    .flag-btn:hover {
      background: var(--amberbg)
    }

    .exam-progress {
      padding: 0 0 6px
    }

    .bar {
      height: 9px;
      background: var(--gray2);
      border-radius: 999px;
      overflow: hidden
    }

    .bar>i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue2), var(--sky));
      border-radius: 999px;
      transition: width .3s ease
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px
    }

    .side {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid #e7eef6;
      padding: 18px;
      position: sticky;
      top: 88px;
    }

    .side h3 {
      font-size: 13px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      max-height: 340px;
      overflow-y: auto;
      padding-right: 4px
    }

    .nav-grid::-webkit-scrollbar {
      width: 6px
    }

    .nav-grid::-webkit-scrollbar-thumb {
      background: var(--gray2);
      border-radius: 99px
    }

    .nav-num {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1.5px solid var(--gray2);
      background: #fbfdff;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
      position: relative;
    }

    .nav-num:hover {
      transform: translateY(-1px);
      border-color: var(--sky)
    }

    .nav-num.answered {
      background: var(--greenbg);
      border-color: var(--green);
      color: var(--green)
    }

    .nav-num.flagged {
      background: var(--amberbg);
      border-color: var(--amber);
      color: var(--amber)
    }

    .nav-num.answered.flagged {
      background: linear-gradient(135deg, var(--greenbg) 50%, var(--amberbg) 50%)
    }

    .nav-num.current {
      box-shadow: 0 0 0 3px rgba(47, 111, 179, .4);
      border-color: var(--blue2);
      background: var(--blue2);
      color: #fff
    }

    .nav-num.flagged::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--amber);
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 600
    }

    .legend .li {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .legend .sw {
      width: 14px;
      height: 14px;
      border-radius: 5px;
      border: 1.5px solid var(--gray2);
      background: #fbfdff;
      flex: 0 0 auto
    }

    .legend .sw.answered {
      background: var(--greenbg);
      border-color: var(--green)
    }

    .legend .sw.flagged {
      background: var(--amberbg);
      border-color: var(--amber)
    }

    .legend .sw.current {
      background: var(--blue2);
      border-color: var(--blue2)
    }

    .side-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 18px
    }

    .side-actions .btn {
      width: 100%
    }

    .result-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
      color: #fff;
      border-radius: 18px;
      padding: 30px 32px;
      box-shadow: 0 14px 40px rgba(11, 37, 69, .32);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .result-hero h2 {
      font-size: clamp(19px, 2.6vw, 26px);
      font-weight: 800;
      letter-spacing: .3px
    }

    .result-hero .identity {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 10px;
      font-size: 13px;
      color: #cfe2f5
    }

    .result-hero .identity b {
      color: #fff
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 0 6px rgba(255, 255, 255, .18);
    }

    .score-circle .inner {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-circle .val {
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      color: #fff
    }

    .score-circle .lbl {
      font-size: 10.5px;
      letter-spacing: 1px;
      color: #bcd6ec;
      margin-top: 4px;
      font-weight: 700
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px
    }

    .stat {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e7eef6;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat .k {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .6px;
      text-transform: uppercase
    }

    .stat .v {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy)
    }

    .stat.green .v {
      color: var(--green)
    }

    .stat.red .v {
      color: var(--red)
    }

    .stat.gray .v {
      color: var(--muted)
    }

    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 8px
    }

    .cat-item {
      background: #fbfdff;
      border: 1px solid var(--gray2);
      border-radius: 12px;
      padding: 15px 17px
    }

    .cat-item .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px
    }

    .cat-item .name {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy)
    }

    .cat-item .score {
      font-size: 13px;
      font-weight: 800;
      color: var(--blue)
    }

    .cat-item .score small {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px
    }

    .cat-item .bar {
      height: 8px
    }

    .cat-item .bar>i {
      background: linear-gradient(90deg, var(--blue2), var(--sky))
    }

    .cat-item.low .bar>i {
      background: linear-gradient(90deg, #d1453a, #e8836b)
    }

    .cat-item.low .score {
      color: var(--red)
    }

    .verdict {
      margin-top: 22px;

      { id: 'P04', cat: 'pedagogik', type: 'single', q: 'Guru memberikan bantuan bertahap kepada murid berupa petunjuk, contoh, dan pengurangan bantuan seiring meningkatnya kemampuan murid. Strategi ini disebut...', opts: ['Scaffolding', 'Drill and practice', 'Pemberian hukuman', 'Ceramah interaktif'], ans: 0, exp: 'Scaffolding adalah pemberian dukungan bertahap yang dikurangi ketika murid sudah mampu.' },
      { id: 'P05', case: true, cat: 'pedagogik', type: 'single', q: 'Seorang guru ingin meningkatkan motivasi intrinsik murid yang tampak acuh pada pelajaran Informatika. Tindakan paling tepat adalah...', opts: ['Memberi nilai tambahan bagi yang aktif', 'Menghubungkan materi dengan masalah nyata yang relevan dan memberi otonomi dalam proyek', 'Mengancam memberi sanksi bagi yang tidak mengerjakan', 'Membandingkan murid dengan teman yang berprestasi'], ans: 1, exp: 'Motivasi intrinsik tumbuh dari relevansi, otonomi, dan rasa kompeten. Menghubungkan materi dengan masalah nyata dan memberi otonomi adalah pilihan terbaik.' },
      { id: 'P06', case: true, cat: 'pedagogik', type: 'single', q: 'Guru menemukan dua murid dengan hambatan penglihatan di kelasnya. Untuk menciptakan pembelajaran inklusif, tindakan paling tepat adalah...', opts: ['Memisahkan mereka agar tidak mengganggu proses belajar', 'Menyesuaikan media, materi, dan asesmen agar dapat diakses semua murid', 'Meminta orang tua mendampingi terus-menerus', 'Mengurangi tuntutan belajar bagi mereka'], ans: 1, exp: 'Pendidikan inklusif menyesuaikan pembelajaran agar semua murid dapat berpartisipasi, bukan memisahkan atau menurunkan tuntutan.' },
      { id: 'P07', cat: 'pedagogik', type: 'complex', q: 'Manakah yang merupakan ciri asesmen formatif? (Pilih semua yang benar)', opts: ['Dilakukan selama proses pembelajaran', 'Bertujuan memantau kemajuan belajar', 'Digunakan untuk menentukan nilai akhir semester', 'Memberi umpan balik untuk perbaikan pembelajaran'], ans: [0, 1, 3], exp: 'Asesmen formatif dilakukan selama proses, memantau kemajuan, dan memberi umpan balik. Penentuan nilai akhir adalah fungsi asesmen sumatif.' },
      { id: 'P08', case: true, cat: 'pedagogik', type: 'single', q: 'Setelah pembelajaran, guru menemukan bahwa 70% murid belum mencapai tujuan pembelajaran pada topik jaringan komputer. Tindakan paling tepat adalah...', opts: ['Melanjutkan ke topik berikutnya karena waktu terbatas', 'Melakukan refleksi, menganalisis penyebab, dan merancang pembelajaran ulang/remedial', 'Memberi nilai rendah sebagai efek jera', 'Menyalahkan murid karena tidak memperhatikan'], ans: 1, exp: 'Guru reflektif menganalisis penyebab ketidaktercapaian dan merancang tindak lanjut (remedial/pembelajaran ulang).' },
      { id: 'P09', case: true, cat: 'pedagogik', type: 'single', q: 'Guru merancang proyek di mana murid membuat aplikasi sederhana untuk menyelesaikan masalah di lingkungan sekolah. Asesmen yang paling autentik adalah...', opts: ['Tes pilihan ganda tentang teori pemrograman', 'Penilaian produk aplikasi disertai presentasi proses dan refleksi', 'Ujian lisan hafalan sintaks', 'Kuis singkat di akhir pertemuan'], ans: 1, exp: 'Asesmen autentik menilai kinerja nyata (produk + proses + refleksi) yang mencerminkan penerapan pengetahuan.' },
      { id: 'P10', case: true, cat: 'pedagogik', type: 'single', q: 'Soal yang menuntut murid menganalisis penyebab kegagalan suatu algoritma dan merancang perbaikan termasuk kategori...', opts: ['Mengingat (C1)', 'Memahami (C2)', 'Menerapkan (C3)', 'Menganalisis-Mencipta (C4-C6)'], ans: 3, exp: 'Menganalisis penyebab dan merancang perbaikan termasuk HOTS level C4-C6.' },
      { id: 'P11', cat: 'pedagogik', type: 'single', q: 'Guru ingin memetakan kemampuan awal murid sebelum memulai topik baru. Asesmen yang tepat adalah...', opts: ['Asesmen sumatif', 'Asesmen diagnostik', 'Asesmen autentik', 'Ujian akhir semester'], ans: 1, exp: 'Asesmen diagnostik dilakukan di awal untuk memetakan kemampuan dan kebutuhan murid.' },
      { id: 'P12', cat: 'pedagogik', type: 'single', q: 'Seorang guru memberikan tugas yang sama kepada semua murid tanpa mempertimbangkan kesiapan. Kelemahan utama praktik ini adalah...', opts: ['Tugas terlalu mudah bagi semua', 'Tidak mengakomodasi perbedaan kesiapan sehingga sebagian murid bosan dan sebagian frustrasi', 'Membuat guru terlalu sibuk', 'Tidak sesuai kurikulum'], ans: 1, exp: 'Tanpa diferensiasi, murid dengan kesiapan berbeda mengalami kebosanan atau frustrasi.' },
      { id: 'P13', case: true, cat: 'pedagogik', type: 'single', q: 'Pendidikan sosial emosional (PSE) paling tepat diintegrasikan dengan cara...', opts: ['Memberi ceramah tentang pentingnya emosi sebulan sekali', 'Membiasakan refleksi perasaan, kerja sama, dan pengelolaan konflik dalam aktivitas belajar sehari-hari', 'Menambah jam pelajaran khusus PSE', 'Menilai emosi murid dengan angka'], ans: 1, exp: 'PSE efektif bila diintegrasikan dalam rutinitas dan interaksi pembelajaran sehari-hari.' },
      { id: 'P14', case: true, cat: 'pedagogik', type: 'single', q: 'Seorang murid pemalu jarang bertanya. Guru ingin memastikan kebutuhan belajarnya terpenuhi. Tindakan paling tepat adalah...', opts: ['Membiarkannya karena itu karakternya', 'Memaksanya bertanya di depan kelas agar berani', 'Menciptakan kesempatan komunikasi yang aman (mis. jurnal, diskusi kelompok kecil, umpan balik tertulis)', 'Menurunkan standar baginya'], ans: 2, exp: 'Guru perlu menyediakan kanal komunikasi yang aman dan inklusif sesuai karakter murid.' },
      { id: 'P15', cat: 'pedagogik', type: 'single', q: 'Pembelajaran berpusat pada murid paling tercermin ketika...', opts: ['Guru mendominasi penjelasan sepanjang pelajaran', 'Murid aktif mengeksplorasi, berdiskusi, dan mengonstruksi pemahaman dengan fasilitasi guru', 'Murid hanya mendengar dan mencatat', 'Guru memberi jawaban atas semua pertanyaan'], ans: 1, exp: 'Pembelajaran berpusat pada murid menempatkan murid sebagai subjek aktif yang mengonstruksi pengetahuan.' },
      { id: 'P16', case: true, cat: 'pedagogik', type: 'single', q: 'Guru menggunakan hasil asesmen formatif untuk membentuk kelompok belajar yang homogen sesuai kemampuan sementara. Tujuan paling tepat adalah...', opts: ['Memberi label permanen pada murid', 'Memberi intervensi yang sesuai kebutuhan masing-masing kelompok', 'Memudahkan guru mengajar', 'Mengurangi jumlah tugas'], ans: 1, exp: 'Pengelompokan sementara berdasarkan asesmen bertujuan memberi intervensi yang sesuai, bukan melabeli permanen.' },
      { id: 'P17', case: true, cat: 'pedagogik', type: 'single', q: 'Dalam pengelolaan kelas yang efektif, guru Informatika menghadapi murid yang sering mengobrol saat praktik. Tindakan paling tepat adalah...', opts: ['Mengeluarkan murid dari kelas', 'Menyusun kesepakatan kelas, memberi tugas yang menantang, dan memantau dengan pendekatan positif', 'Membiarkan agar tidak memperbesar masalah', 'Memberi hukuman fisik'], ans: 1, exp: 'Pengelolaan kelas efektif menggunakan kesepakatan, keterlibatan aktif, dan pendekatan positif, bukan hukuman represif.' },
      { id: 'P18', case: true, cat: 'pedagogik', type: 'single', q: 'Seorang guru melakukan refleksi setelah pembelajaran. Manakah yang paling mencerminkan refleksi mendalam?', opts: ['Mencatat bahwa pelajaran berjalan lancar', 'Menganalisis bukti belajar murid, mengevaluasi strategi yang digunakan, dan merencanakan perbaikan konkret', 'Menyalin catatan guru lain', 'Mengisi jurnal kehadiran'], ans: 1, exp: 'Refleksi mendalam berbasis bukti belajar, evaluasi strategi, dan rencana perbaikan konkret.' },
      { id: 'P19', case: true, cat: 'pedagogik', type: 'single', q: 'Guru IPA menemukan miskonsepsi murid bahwa "benda berat selalu jatuh lebih cepat". Strategi paling tepat untuk mengoreksi miskonsepsi adalah...', opts: ['Menjelaskan ulang konsep dengan ceramah', 'Membiarkan murid menemukan sendiri lewat eksperimen terbimbing dan diskusi bukti', 'Memberi hukuman pada yang salah', 'Menghafalkan rumus'], ans: 1, exp: 'Miskonsepsi dikoreksi efektif melalui konflik kognitif dari pengalaman/eksperimen dan diskusi berbasis bukti.' },
      { id: 'P20', cat: 'pedagogik', type: 'single', q: 'Guru ingin melibatkan murid dalam menilai pekerjaan teman. Manfaat utama peer assessment adalah...', opts: ['Menghemat waktu guru', 'Melatih murid memahami kriteria, memberi umpan balik, dan merefleksikan kualitas karya', 'Menggantikan penilaian guru sepenuhnya', 'Membuat murid saling bersaing'], ans: 1, exp: 'Peer assessment melatih pemahaman kriteria, umpan balik, dan refleksi, bukan menggantikan penilaian guru.' },
      { id: 'P21', case: true, cat: 'pedagogik', type: 'bs', q: 'Bacalah situasi berikut: Guru menyampaikan tujuan pembelajaran, memberikan asesmen awal, lalu merancang aktivitas yang berbeda untuk tiga kelompok murid. Ia juga menyediakan waktu refleksi di akhir. Tentukan Benar atau Salah untuk setiap pernyataan.', stmts: ['Guru menggunakan asesmen diagnostik di awal pembelajaran.', 'Guru menerapkan pembelajaran berdiferensiasi.', 'Guru menutup pembelajaran dengan refleksi murid.'], ans: [true, true, true], exp: 'Semua pernyataan sesuai dengan praktik yang digambarkan.' },
      { id: 'P22', case: true, cat: 'pedagogik', type: 'single', q: 'Murid dengan gaya belajar kinestetik sulit duduk diam. Tindakan guru paling tepat adalah...', opts: ['Memaksanya duduk diam', 'Mengintegrasikan aktivitas bergerak/praktik dalam pembelajaran', 'Memberinya hukuman', 'Mengabaikannya'], ans: 1, exp: 'Guru sebaiknya mengakomodasi kebutuhan belajar melalui aktivitas yang sesuai, bukan memaksa.' },
      { id: 'P23', cat: 'pedagogik', type: 'single', q: 'Tujuan utama asesmen autentik adalah...', opts: ['Mengukur hafalan', 'Menilai kemampuan murid menerapkan pengetahuan dalam konteks nyata', 'Memudahkan penilaian', 'Membandingkan murid'], ans: 1, exp: 'Asesmen autentik menilai penerapan pengetahuan/keterampilan dalam konteks nyata.' },
      { id: 'P24', cat: 'pedagogik', type: 'single', q: 'Guru memberikan soal yang menuntut murid mengevaluasi dua solusi algoritma dan memilih yang lebih efisien. Soal ini termasuk...', opts: ['LOTS', 'HOTS', 'Soal hafalan', 'Soal prosedural rutin'], ans: 1, exp: 'Mengevaluasi dan memilih solusi terbaik termasuk HOTS.' },
      { id: 'P25', case: true, cat: 'pedagogik', type: 'single', q: 'Seorang guru ingin memastikan semua murid terlibat dalam diskusi kelompok. Strategi paling tepat adalah...', opts: ['Menunjuk satu murid untuk mewakili kelompok', 'Memberi peran spesifik dan tanggung jawab individual dalam kelompok', 'Membiarkan kelompok mengatur sendiri', 'Mengurangi jumlah anggota'], ans: 1, exp: 'Peran dan tanggung jawab individual memastikan akuntabilitas dan keterlibatan semua anggota.' },
      { id: 'P26', case: true, cat: 'pedagogik', type: 'single', q: 'Guru menemukan murid yang cemas saat menghadapi ujian. Tindakan paling tepat adalah...', opts: ['Mengabaikan karena akan terbiasa', 'Menciptakan iklim aman, memberi kesempatan latihan, dan umpan balik konstruktif', 'Menambah frekuensi ujian', 'Membandingkan dengan teman'], ans: 1, exp: 'Iklim aman, latihan, dan umpan balik konstruktif membantu mengurangi kecemasan.' },
      { id: 'P27', cat: 'pedagogik', type: 'single', q: 'Model TaRL (Teaching at the Right Level) paling tepat diterapkan ketika...', opts: ['Semua murid memiliki kemampuan sama', 'Guru mengelompokkan murid berdasarkan level kemampuan dan memberi pembelajaran sesuai level', 'Guru hanya mengajar murid pintar', 'Guru memberi tugas yang sama'], ans: 1, exp: 'TaRL menyesuaikan pembelajaran dengan level kemampuan aktual murid.' },
      { id: 'P28', cat: 'pedagogik', type: 'complex', q: 'Manakah pernyataan yang benar tentang asesmen sumatif? (Pilih semua yang benar)', opts: ['Dilakukan di akhir pembelajaran/semester', 'Digunakan untuk mengukur ketercapaian tujuan', 'Memberi umpan balik perbaikan selama proses', 'Sering digunakan untuk laporan hasil belajar'], ans: [0, 1, 3], exp: 'Sumatif di akhir, mengukur ketercapaian, dan untuk laporan. Umpan balik perbaikan selama proses adalah fungsi formatif.' },
      { id: 'P29', case: true, cat: 'pedagogik', type: 'single', q: 'Seorang guru ingin membangun kemandirian murid dalam belajar. Tindakan paling tepat adalah...', opts: ['Memberi semua jawaban', 'Melatih murid menetapkan tujuan, memantau kemajuan, dan mengevaluasi belajar sendiri', 'Mengawasi setiap langkah', 'Mengurangi tugas'], ans: 1, exp: 'Kemandirian dibangun melalui metakognisi: menetapkan tujuan, memantau, dan mengevaluasi diri.' },
      { id: 'P30', cat: 'pedagogik', type: 'single', q: 'Pembelajaran yang mengakomodasi keragaman murid, termasuk yang berkebutuhan khusus, disebut...', opts: ['Pembelajaran eksklusif', 'Pembelajaran inklusif', 'Pembelajaran klasikal', 'Pembelajaran individual'], ans: 1, exp: 'Pembelajaran inklusif mengakomodasi keragaman semua murid.' },
      { id: 'P31', case: true, cat: 'pedagogik', type: 'single', q: 'Anda membimbing proyek kelompok sistem perpustakaan. Satu kelompok tampak pasif dan hanya mengandalkan satu anggota. Tindakan paling tepat adalah...', opts: ['Membiarkan karena hasil akhir tetap jadi', 'Memberi peran dan tanggung jawab individual yang jelas, serta memantau kontribusi tiap anggota', 'Mengurangi nilai seluruh kelompok', 'Memindahkan anggota pasif ke kelompok lain tanpa dialog'], ans: 1, exp: 'Pembelajaran kolaboratif efektif membutuhkan akuntabilitas individual dan peran jelas agar semua terlibat.' },
      { id: 'P32', case: true, cat: 'pedagogik', type: 'single', q: 'Selama proyek berlangsung, Anda menemukan beberapa siswa kebingungan membagi tugas. Anda memberi contoh cara memecah tugas dan perlahan mengurangi bantuan seiring kemampuan siswa meningkat. Strategi ini disebut...', opts: ['Scaffolding', 'Hukuman', 'Ceramah', 'Drill'], ans: 0, exp: 'Memberi dukungan bertahap lalu menguranginya seiring kemampuan siswa adalah scaffolding.' },
      { id: 'P33', case: true, cat: 'pedagogik', type: 'complex', q: 'Anda merancang pembelajaran berdiferensiasi pada topik algoritma. Manakah tindakan yang mencerminkan diferensiasi yang tepat? (Pilih semua yang benar)', opts: ['Memberi materi berbeda sesuai kesiapan siswa', 'Memberi semua siswa tugas yang sama persis tanpa variasi', 'Menyediakan pilihan cara menunjukkan pemahaman (lisan, tertulis, produk)', 'Mengelompokkan siswa secara permanen berdasarkan kemampuan', 'Memberi dukungan tambahan bagi siswa yang membutuhkan'], ans: [0, 2, 4], exp: 'Diferensiasi menyesuaikan konten/proses/produk dan memberi dukungan sesuai kebutuhan, bukan menyeragamkan atau melabeli permanen.' },
      { id: 'P34', case: true, cat: 'pedagogik', type: 'bs', q: 'Seorang guru menemukan 70% murid belum mencapai tujuan pembelajaran pada topik jaringan komputer. Tentukan Benar atau Salah untuk setiap tindakan berikut.', stmts: ['Melanjutkan ke topik berikutnya karena waktu terbatas.', 'Menganalisis penyebab ketidaktercapaian berdasarkan bukti asesmen.', 'Merancang pembelajaran ulang atau remedial yang terarah.', 'Memberi nilai rendah sebagai efek jera.', 'Melibatkan murid dalam refleksi untuk memahami kesulitan mereka.'], ans: [false, true, true, false, true], exp: 'Guru reflektif menganalisis penyebab, merancang remedial, dan melibatkan murid. Melanjutkan tanpa perbaikan atau menghukum bukan tindakan mendidik.' },
      { id: 'P35', case: true, cat: 'pedagogik', type: 'single', q: 'Seorang murid mampu menyelesaikan soal algoritma jika dibantu langkah demi langkah, tetapi belum bisa mandiri. Berdasarkan teori Vygotsky, tindakan paling tepat adalah...', opts: ['Membiarkan murid bekerja sendiri agar mandiri', 'Memberi scaffolding bertahap dan menguranginya seiring kemampuan meningkat', 'Memberi soal yang lebih sulit', 'Menurunkan standar penilaian'], ans: 1, exp: 'ZPD dicapai melalui scaffolding bertahap yang dikurangi seiring kemampuan murid meningkat.' },
      { id: 'P36', case: true, cat: 'pedagogik', type: 'single', q: 'Anda menemukan murid dengan miskonsepsi bahwa "benda berat selalu jatuh lebih cepat". Strategi paling tepat untuk mengoreksi miskonsepsi adalah...', opts: ['Menjelaskan ulang konsep dengan ceramah', 'Membiarkan murid menemukan sendiri lewat eksperimen terbimbing dan diskusi bukti', 'Memberi hukuman pada yang salah', 'Menghafalkan rumus'], ans: 1, exp: 'Miskonsepsi dikoreksi efektif melalui konflik kognitif dari eksperimen dan diskusi berbasis bukti.' },
      { id: 'P37', case: true, cat: 'pedagogik', type: 'single', q: 'Anda mengajar di kelas dengan murid yang sangat beragam kemampuannya. Anda ingin memastikan semua murid berkembang optimal. Pendekatan paling tepat adalah...', opts: ['Mengajar dengan kecepatan rata-rata kelas', 'Menerapkan pembelajaran berdiferensiasi berdasarkan kesiapan, minat, dan profil belajar', 'Hanya fokus pada murid yang cepat memahami', 'Memberi tugas yang sama untuk semua'], ans: 1, exp: 'Diferensiasi berdasarkan kesiapan, minat, dan profil belajar memastikan semua murid berkembang.' },
      { id: 'P38', case: true, cat: 'pedagogik', type: 'complex', q: 'Manakah yang merupakan indikator pembelajaran bermakna (deep learning)? (Pilih semua yang benar)', opts: ['Siswa mampu menghubungkan konsep dengan pengalaman nyata', 'Siswa hanya menghafal definisi', 'Siswa mampu merefleksikan proses belajarnya', 'Siswa mampu menerapkan konsep pada situasi baru', 'Siswa menyalin jawaban teman'], ans: [0, 2, 3], exp: 'Pembelajaran bermakna ditandai kemampuan menghubungkan, merefleksi, dan menerapkan, bukan menghafal atau menyalin.' },
      { id: 'P39', case: true, cat: 'pedagogik', type: 'single', q: 'Anda menemukan bahwa beberapa siswa selalu menunggu instruksi dan tidak berinisiatif. Untuk membangun kemandirian, tindakan paling tepat adalah...', opts: ['Memberi instruksi yang lebih rinci setiap saat', 'Melatih siswa menetapkan tujuan, memantau kemajuan, dan mengevaluasi belajar sendiri', 'Membiarkan siswa tanpa bimbingan', 'Mengurangi tugas'], ans: 1, exp: 'Kemandirian dibangun melalui metakognisi: menetapkan tujuan, memantau, dan mengevaluasi diri.' },
      { id: 'P40', case: true, cat: 'pedagogik', type: 'bs', q: 'Seorang guru merancang pembelajaran dengan memberi siswa pilihan cara menunjukkan pemahaman (presentasi, poster, atau video). Tentukan Benar atau Salah untuk setiap pernyataan berikut.', stmts: ['Guru menerapkan diferensiasi produk.', 'Guru memberikan otonomi kepada siswa.', 'Guru mengabaikan perbedaan minat siswa.', 'Guru mengakomodasi gaya belajar yang beragam.', 'Guru menurunkan standar penilaian.'], ans: [true, true, false, true, false], exp: 'Memberi pilihan produk = diferensiasi produk dan otonomi, serta mengakomodasi gaya belajar. Bukan mengabaikan minat atau menurunkan standar.' }
    ];

    var bankProfInf = [
      { id: 'PR-I01', case: true, cat: 'profesional', type: 'single', q: 'Seorang murid menggunakan binary search pada data yang belum diurutkan. Kesalahan konsep utama murid tersebut adalah...', opts: ['Binary search hanya untuk data angka', 'Binary search mensyaratkan data terurut agar pembagian ruang pencarian valid', 'Binary search tidak bisa digunakan pada array', 'Binary search memerlukan rekursi'], ans: 1, exp: 'Prasyarat binary search adalah data terurut; tanpa itu pembagian ruang pencarian tidak valid.' },
      { id: 'PR-I02', cat: 'profesional', type: 'single', q: 'Dalam pseudocode, struktur yang digunakan untuk mengulang pernyataan selama kondisi benar adalah...', opts: ['if-then', 'while', 'input', 'procedure'], ans: 1, exp: 'while adalah perulangan selama kondisi bernilai benar.' },
      { id: 'PR-I03', cat: 'profesional', type: 'single', q: 'Seorang murid menulis kode: x = 5; x = x + 2; x = x * 3. Nilai akhir x adalah...', opts: ['11', '15', '21', '30'], ans: 2, exp: 'x=5; x=7; x=21. Jadi nilai akhir 21.' },
      { id: 'PR-I04', cat: 'profesional', type: 'single', q: 'Struktur data yang menerapkan prinsip LIFO adalah...', opts: ['Queue', 'Stack', 'Array', 'Linked list'], ans: 1, exp: 'Stack = Last In First Out (LIFO).' },
      { id: 'PR-I05', cat: 'profesional', type: 'single', q: 'Algoritma pengurutan yang membandingkan elemen berdekatan dan menukarnya jika salah urutan adalah...', opts: ['Quick sort', 'Bubble sort', 'Merge sort', 'Binary search'], ans: 1, exp: 'Bubble sort membandingkan dan menukar elemen berdekatan.' },
      { id: 'PR-I06', case: true, cat: 'profesional', type: 'single', q: 'Guru ingin mengajarkan konsep percabangan. Kasus paling kontekstual adalah...', opts: ['Menghafal sintaks if', 'Membuat program penentu kelulusan berdasarkan nilai KKM', 'Menulis ulang definisi', 'Mendengarkan ceramah'], ans: 1, exp: 'Kasus penentu kelulusan menggunakan percabangan secara kontekstual dan bermakna.' },
      { id: 'PR-I07', cat: 'profesional', type: 'single', q: 'Miskonsepsi umum tentang array adalah...', opts: ['Array menyimpan banyak data sejenis', 'Indeks array biasanya dimulai dari 0', 'Array tidak memerlukan ukuran dan dapat menyimpan semua tipe sekaligus secara bebas', 'Array dapat diakses dengan indeks'], ans: 2, exp: 'Array umumnya menyimpan tipe sejenis dan memiliki ukuran tetap (pada struktur statis).' },

    /* =========================================================
       LOGIC — buildExam dengan prioritas soal kasus & bidang eksklusif
       ========================================================= */
    function buildExam(field) {
      var profBank = field === 'Informatika' ? bankProfInf : bankProfIpa;
      var banks = {
        pedagogik: bankPedagogik,
        profesional: profBank,
        kepribadian: bankKepribadian,
        sosial: bankSosial,
        teori: bankTeori,
        kurikulum: bankKurikulum
      };
      var keys = Object.keys(COMPOSITION);
      var chosen = [];
      var usedIds = {};

      function takeFrom(arr, n, requireCase) {
        var pool = arr.filter(function (q) {
          if (usedIds[q.id]) return false;
          if (requireCase && !q.case) return false;
          return true;
        });
        var picked = pick(pool, n);
        for (var i = 0; i < picked.length; i++) { usedIds[picked[i].id] = true; chosen.push(picked[i]); }
        return picked.length;
      }

      // Tahap 1: penuhi kuota kasus per kategori
      for (var k = 0; k < keys.length; k++) {
        var cat = keys[k];
        var quotaCase = CASE_QUOTA[cat] || 0;
        takeFrom(banks[cat], quotaCase, true);
      }

      // Tahap 2: lengkapi sisa kuota kategori dengan soal apa pun (case/non-case)
      for (var k2 = 0; k2 < keys.length; k2++) {
        var cat2 = keys[k2];
        var already = chosen.filter(function (q) { return q.cat === cat2; }).length;
        var need = COMPOSITION[cat2] - already;
        if (need > 0) takeFrom(banks[cat2], need, false);
      }

      // Tahap 3: fallback jika masih kurang dari TOTAL_Q
      if (chosen.length < TOTAL_Q) {
        var allPool = [];
        for (var k3 = 0; k3 < keys.length; k3++) {
          allPool = allPool.concat(banks[keys[k3]].filter(function (q) { return !usedIds[q.id]; }));
        }
        var extra = pick(allPool, TOTAL_Q - chosen.length);
        chosen = chosen.concat(extra);
      }

      return shuffle(chosen).slice(0, TOTAL_Q);
    }

    function isAnswered(q, ans) {
      if (ans === undefined || ans === null) return false;
      if (q.type === 'single') return typeof ans === 'number';
      if (q.type === 'complex') return Array.isArray(ans) && ans.length > 0;
      if (q.type === 'bs') return ans && typeof ans === 'object' && Object.keys(ans).length === q.stmts.length;
      return false;
    }
    function isCorrect(q, ans) {
      if (!isAnswered(q, ans)) return false;
      if (q.type === 'single') return ans === q.ans;
      if (q.type === 'complex') {
        var a = ans.slice().sort(function (x, y) { return x - y; });
        var b = q.ans.slice().sort(function (x, y) { return x - y; });
        if (a.length !== b.length) return false;
        for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
        return true;
      }
      if (q.type === 'bs') {
        for (var j = 0; j < q.stmts.length; j++) { if (!!ans[j] !== !!q.ans[j]) return false; }
        return true;
      }
      return false;
    }
    function computeResult() {
      var byCat = {};
      var keys = Object.keys(COMPOSITION);
      for (var k = 0; k < keys.length; k++) byCat[keys[k]] = { correct: 0, total: 0 };
      var correct = 0, wrong = 0, empty = 0;
      for (var i = 0; i < state.questions.length; i++) {
        var q = state.questions[i];
        byCat[q.cat].total++;
        var ans = state.answers[q.id];
        if (!isAnswered(q, ans)) { empty++; }
        else if (isCorrect(q, ans)) { correct++; byCat[q.cat].correct++; }
        else { wrong++; }
      }
      var score = Math.round((correct / TOTAL_Q) * 100);
      return { correct: correct, wrong: wrong, empty: empty, score: score, byCat: byCat };
    }
    function verdictOf(score) {
      if (score >= 90) return { label: 'Sangat Baik', cls: 'great', icon: '🏆', desc: 'Penguasaan materi sangat baik. Pertahankan dan asah lebih lanjut.' };
      if (score >= 80) return { label: 'Baik', cls: 'good', icon: '👍', desc: 'Penguasaan materi baik. Perkuat area yang masih lemah.' };
      if (score >= 70) return { label: 'Cukup', cls: 'mid', icon: '📘', desc: 'Penguasaan materi cukup. Perlu penguatan pada beberapa kategori.' };
      if (score >= 60) return { label: 'Perlu Penguatan', cls: 'mid', icon: '⚠️', desc: 'Perlu penguatan pada banyak kategori. Disarankan belajar lebih terarah.' };
      return { label: 'Perlu Belajar Lebih Intensif', cls: 'low', icon: '📚', desc: 'Perlu belajar lebih intensif dan latihan soal secara bertahap.' };
    }
    function recommendation(byCat) {
      var names = Object.keys(byCat).filter(function (c) { return byCat[c].total > 0; });
      names.sort(function (a, b) { return (byCat[a].correct / byCat[a].total) - (byCat[b].correct / byCat[b].total); });
      var lowest = names[0];
      var pct = byCat[lowest].correct / byCat[lowest].total;
      if (pct >= 0.8) return 'Penguasaan semua kategori sudah relatif baik. Pertahankan konsistensi belajar dan perdalam soal-soal analisis.';
      var map = {
        pedagogik: 'pedagogik (karakteristik murid, diferensiasi, asesmen, dan pengelolaan kelas)',
        profesional: 'profesional/PCK bidang studi yang dipilih (analisis konsep dan miskonsepsi)',
        kepribadian: 'kompetensi kepribadian (integritas, etika, dan pengambilan keputusan)',
        sosial: 'kompetensi sosial (komunikasi, kolaborasi, dan keberagaman)',
        teori: 'teori belajar dan tokoh (penerapan teori pada situasi pembelajaran)',
        kurikulum: 'kurikulum, asesmen, pembelajaran mendalam, dan diferensiasi'
      };
      return 'Berdasarkan hasil, area yang masih paling perlu diperkuat adalah ' + map[lowest] + '. Disarankan memperbanyak latihan kasus dan mempelajari kembali konsep dasarnya.';
    }

    function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { } }
    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        var s = JSON.parse(raw);
        if (!s || typeof s !== 'object') return false;
        for (var k in s) { if (s.hasOwnProperty(k)) state[k] = s[k]; }
        return true;
      } catch (e) { return false; }
    }
    function clearState() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { }
      state = {
        screen: 'start', name: '', field: '', questions: [], answers: {}, flags: {},
        current: 0, startedAt: null, endAt: null, finishedAt: null,
        remainingSec: EXAM_DURATION_SEC, timerWarned: { 30: false, 10: false, 5: false }, reviewFilter: 'all'
      };
    }

      try {
        var raw = localStorage.getItem(ADMIN_KEY);

      } catch (e) { return []; }
    }

    function addAdminRecord(rec) { var list = loadAdminData(); list.push(rec); saveAdminData(list); }
    function deleteAdminRecord(id) { var list = loadAdminData().filter(function (r) { return r.id !== id; }); saveAdminData(list); }

    function startExam() {
      var name = $('#inpName').value.trim();
      var field = $('#selField').value;
      var err = $('#startErr');
      err.textContent = '';
      if (!name) { err.textContent = 'Nama peserta wajib diisi.'; return; }
      if (!field) { err.textContent = 'Bidang studi wajib dipilih.'; return; }
      if (name.length < 2) { err.textContent = 'Nama minimal 2 karakter.'; return; }
      if (state.questions && state.questions.length > 0 && !state.finishedAt) {
        if (!confirm('Terdapat sesi tryout yang belum selesai. Memulai tryout baru akan menghapus sesi lama. Lanjutkan?')) return;
      }
      clearInterval(timerInterval);
      state.name = name;
      state.field = field;
      state.questions = buildExam(field);
      state.answers = {};
      state.flags = {};
      state.current = 0;
      state.startedAt = Date.now();
      state.endAt = state.startedAt + EXAM_DURATION_SEC * 1000;
      state.finishedAt = null;
      state.remainingSec = EXAM_DURATION_SEC;
      state.timerWarned = { 30: false, 10: false, 5: false };
      state.screen = 'exam';
      saveState();
      renderAll();
      startTimer();
    }

    function startTimer() { clearInterval(timerInterval); timerInterval = setInterval(tick, 1000); tick(); }
    function tick() {
      if (state.screen !== 'exam') { clearInterval(timerInterval); return; }
      if (!state.endAt) return;
      var sisa = Math.max(0, Math.floor((state.endAt - Date.now()) / 1000));
      state.remainingSec = sisa;
      var el = $('#timerPill');
      if (el) {
        el.textContent = '⏱ ' + fmtTime(sisa);
        el.className = 'pill timer-pill' + (sisa <= 300 ? ' danger' : sisa <= 1800 ? ' warn' : '');
      }
      if (sisa <= 1800 && sisa > 1790 && !state.timerWarned[30]) { state.timerWarned[30] = true; showToast('⏳ Waktu tersisa 30 menit.'); }
      if (sisa <= 600 && sisa > 590 && !state.timerWarned[10]) { state.timerWarned[10] = true; showToast('⏳ Waktu tersisa 10 menit.'); }
      if (sisa <= 300 && sisa > 290 && !state.timerWarned[5]) { state.timerWarned[5] = true; showToast('⚠️ Waktu tersisa 5 menit.'); }
      saveState();
      if (sisa <= 0) { clearInterval(timerInterval); submitExam(true); }
    }

    function renderExam() {
      var app = $('#app');
      var q = state.questions[state.current];
      var idx = state.current;
      var total = state.questions.length;
      var answeredCount = 0;
      for (var i = 0; i < state.questions.length; i++) { if (isAnswered(state.questions[i], state.answers[state.questions[i].id])) answeredCount++; }
      var pct = Math.round((answeredCount / total) * 100);
      var html = '' +
        '<div class="exam-progress"><div class="progress-label"><span>Progres pengerjaan</span><span>' + answeredCount + '/' + total + ' soal dijawab (' + pct + '%)</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="exam-layout" style="margin-top:16px">' +
        '<div class="q-card">' +
        '<div class="q-top"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
        '<span class="q-badge">SOAL ' + (idx + 1) + ' / ' + total + '</span>' +
        '<span class="q-cat" style="color:' + catColor(q.cat) + '">' + catLabel(q.cat) + '</span>' +
        '</div><span style="font-size:11.5px;color:var(--muted);font-weight:600">' + typeLabel(q) + '</span></div>' +
        '<div class="q-body"><div class="q-text">' + esc(q.q) + '</div>' +
        (q.type === 'complex' ? '<div class="instruction">Pilih semua jawaban yang benar (bisa lebih dari satu).</div>' : '') +
        (q.type === 'bs' ? '<div class="instruction">Tentukan Benar atau Salah untuk setiap pernyataan.</div>' : '');
      if (q.type === 'single') {
        html += '<div class="options">';
        for (var o = 0; o < q.opts.length; o++) {
          var sel = state.answers[q.id] === o ? ' selected' : '';
          html += '<div class="opt' + sel + '" data-opt="' + o + '"><div class="marker">' + String.fromCharCode(65 + o) + '</div><div class="opt-txt">' + esc(q.opts[o]) + '</div></div>';
        }
        html += '</div>';
      } else if (q.type === 'complex') {
        var cur = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
        html += '<div class="options">';
        for (var o2 = 0; o2 < q.opts.length; o2++) {
          var sel2 = cur.indexOf(o2) >= 0 ? ' selected' : '';
          html += '<div class="opt' + sel2 + '" data-copt="' + o2 + '"><div class="marker sq">' + String.fromCharCode(65 + o2) + '</div><div class="opt-txt">' + esc(q.opts[o2]) + '</div></div>';
        }
        html += '</div>';
      } else if (q.type === 'bs') {
        var curb = state.answers[q.id] || {};
        html += '<div class="options">';
        for (var s = 0; s < q.stmts.length; s++) {
          var v = curb[s];
          html += '<div class="bs-row"><div class="stmt">' + (s + 1) + '. ' + esc(q.stmts[s]) + '</div><div class="bs-btns">' +
            '<button class="bs-btn' + (v === true ? ' on-true' : '') + '" data-bs="' + s + '" data-val="true">Benar</button>' +
            '<button class="bs-btn' + (v === false ? ' on-false' : '') + '" data-bs="' + s + '" data-val="false">Salah</button>' +
            '</div></div>';
        }
        html += '</div>';
      }
      html += '</div>' +
        '<div class="q-footer">' +
        '<div class="left">' +
        '<button class="flag-btn' + (state.flags[q.id] ? ' active' : '') + '" id="btnFlag">🚩 Ragu-ragu</button>' +
        '</div>' +
        '<div class="right">' +
        '<button class="btn btn-outline" id="btnPrev"' + (idx === 0 ? ' disabled' : '') + '>Sebelumnya</button>' +
        '<button class="btn btn-primary" id="btnNext">' + (idx === total - 1 ? 'Selesai' : 'Berikutnya') + '</button>' +
        '</div>' +
        '</div>' +
        '</div>' +
        '<div class="side">' +
        '<h3>Navigasi Soal</h3>' +
        '<div class="nav-grid" id="navGrid">';
      for (var n = 0; n < total; n++) {
        var qq = state.questions[n];
        var cls = 'nav-num';
        if (isAnswered(qq, state.answers[qq.id])) cls += ' answered';
        if (state.flags[qq.id]) cls += ' flagged';
        if (n === idx) cls += ' current';
        html += '<div class="' + cls + '" data-nav="' + n + '">' + (n + 1) + '</div>';
      }
      html += '</div>' +
        '<div class="legend">' +
        '<div class="li"><span class="sw answered"></span>Sudah dijawab</div>' +
        '<div class="li"><span class="sw flagged"></span>Ragu-ragu</div>' +
        '<div class="li"><span class="sw current"></span>Sedang dikerjakan</div>' +
        '</div>' +
        '<div class="side-actions">' +
        '<button class="btn btn-green" id="btnFinishSide">Selesaikan Tryout</button>' +
        '<button class="btn btn-outline" id="btnHomeSide">Keluar ke Halaman Awal</button>' +
        '</div>' +
        '</div>' +
        '</div>';
      app.innerHTML = html;

      $$('.opt[data-opt]').forEach(function (el) {
        el.onclick = function () {
          var o = parseInt(el.getAttribute('data-opt'));
          state.answers[q.id] = o;
          saveState();
          renderExam();
        };
      });
      $$('.opt[data-copt]').forEach(function (el) {
        el.onclick = function () {
          var o = parseInt(el.getAttribute('data-copt'));
          var cur = Array.isArray(state.answers[q.id]) ? state.answers[q.id].slice() : [];
          var pos = cur.indexOf(o);
          if (pos >= 0) cur.splice(pos, 1); else cur.push(o);
          state.answers[q.id] = cur;
          saveState();
          renderExam();
        };
      });
      $$('.bs-btn[data-bs]').forEach(function (el) {
        el.onclick = function () {
          var s = parseInt(el.getAttribute('data-bs'));
          var val = el.getAttribute('data-val') === 'true';
          var curb = state.answers[q.id] || {};
          curb[s] = val;
          state.answers[q.id] = curb;
          saveState();
          renderExam();
        };
      });
      $('#btnFlag').onclick = function () {
        state.flags[q.id] = !state.flags[q.id];
        saveState(); renderExam();
      };
      $('#btnPrev').onclick = function () { if (state.current > 0) { state.current--; saveState(); renderExam(); } };
      $('#btnNext').onclick = function () {
        if (state.current < total - 1) { state.current++; saveState(); renderExam(); }
        else { confirmFinish(); }
      };
      $$('.nav-num[data-nav]').forEach(function (el) {
        el.onclick = function () {
          state.current = parseInt(el.getAttribute('data-nav'));
          saveState(); renderExam();
        };
      });
      $('#btnFinishSide').onclick = confirmFinish;
      $('#btnHomeSide').onclick = function () {
        if (confirm('Keluar ke halaman awal? Progres tryout tetap tersimpan.')) { goHome(); }
      };
    }

    function confirmFinish() {
      var total = state.questions.length;
      var answered = 0;
      for (var i = 0; i < total; i++) { if (isAnswered(state.questions[i], state.answers[state.questions[i].id])) answered++; }
      var msg = 'Anda telah menjawab ' + answered + ' dari ' + total + ' soal.';
      if (answered < total) msg += '\nMasih ada ' + (total - answered) + ' soal belum dijawab.';
      msg += '\n\nSelesaikan tryout sekarang?';
      if (confirm(msg)) { submitExam(false); }
    }

    function submitExam(auto) {
      clearInterval(timerInterval);
      state.finishedAt = Date.now();
      state.screen = 'result';
      saveState();
      var r = computeResult();
      var rec = {
        id: uid(), name: state.name, field: state.field, score: r.score,
        correct: r.correct, wrong: r.wrong, empty: r.empty, byCat: r.byCat,
        startedAt: state.startedAt, finishedAt: state.finishedAt,
        durationMs: state.finishedAt - state.startedAt, auto: !!auto,
        questions: state.questions, answers: state.answers
      };
      addAdminRecord(rec);
      renderAll();
      if (auto) showToast('⏰ Waktu habis. Tryout otomatis diselesaikan.');
    }

    function renderResult() {
      var app = $('#app');
      var r = computeResult();
      var v = verdictOf(r.score);
      var dur = state.finishedAt && state.startedAt ? fmtDuration(state.finishedAt - state.startedAt) : '-';
      var html = '' +
        '<div class="result-hero">' +
        '<div><h2>Hasil Tryout</h2>' +
        '<div class="identity"><span>Nama: <b>' + esc(state.name) + '</b></span><span>Bidang: <b>' + esc(state.field) + '</b></span><span>Durasi: <b>' + dur + '</b></span></div>' +
        '</div>' +
        '<div class="score-circle"><div class="inner"><div class="val">' + r.score + '</div><div class="lbl">SKOR</div></div></div>' +
        '</div>' +
        '<div class="stat-grid">' +
        '<div class="stat green"><div class="k">Benar</div><div class="v">' + r.correct + '</div></div>' +
        '<div class="stat red"><div class="k">Salah</div><div class="v">' + r.wrong + '</div></div>' +
        '<div class="stat gray"><div class="k">Kosong</div><div class="v">' + r.empty + '</div></div>' +
        '<div class="stat"><div class="k">Total Soal</div><div class="v">' + state.questions.length + '</div></div>' +
        '</div>' +
        '<div class="card">' +
        '<div class="section-title">Analisis per Kategori</div>' +
        '<div class="section-sub">Persentase benar pada setiap kompetensi.</div>' +
        '<div class="cat-grid">';
      var keys = Object.keys(r.byCat);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i], c = r.byCat[k];
        if (c.total === 0) continue;
        var p = Math.round((c.correct / c.total) * 100);
        var low = p < 60 ? ' low' : '';
        html += '<div class="cat-item' + low + '">' +
          '<div class="row"><span class="name">' + catLabel(k) + '</span><span class="score">' + c.correct + '/' + c.total + ' <small>(' + p + '%)</small></span></div>' +
          '<div class="bar"><i style="width:' + p + '%"></i></div>' +
          '</div>';
      }
      html += '</div>' +
        '<div class="verdict ' + v.cls + '"><div class="big">' + v.icon + '</div><div class="txt"><h4>' + v.label + '</h4><p>' + v.desc + '</p></div></div>' +
        '<div class="recommend"><b>Rekomendasi:</b> ' + recommendation(r.byCat) + '</div>' +
        '<div class="result-actions">' +
        '<button class="btn btn-primary" id="btnReview">Lihat Pembahasan</button>' +
        '<button class="btn btn-outline" id="btnHome">Halaman Awal</button>' +
        '</div>' +
        '</div>';
      app.innerHTML = html;
      $('#btnReview').onclick = function () { state.screen = 'review'; state.reviewFilter = 'all'; saveState(); renderAll(); };
      $('#btnHome').onclick = goHome;
    }

    function renderReview() {
      var app = $('#app');
      var filter = state.reviewFilter || 'all';
      var html = '<div class="card">' +
        '<div class="review-head"><div><div class="section-title">Pembahasan Soal</div><div class="section-sub">Tinjau jawaban Anda dan pelajari pembahasannya.</div></div>' +
        '<button class="btn btn-outline" id="btnBackResult">Kembali ke Hasil</button></div>' +
        '<div class="review-tabs">' +
        '<button class="rtab' + (filter === 'all' ? ' active' : '') + '" data-rf="all">Semua</button>' +
        '<button class="rtab' + (filter === 'correct' ? ' active' : '') + '" data-rf="correct">Benar</button>' +
        '<button class="rtab' + (filter === 'wrong' ? ' active' : '') + '" data-rf="wrong">Salah</button>' +
        '<button class="rtab' + (filter === 'empty' ? ' active' : '') + '" data-rf="empty">Kosong</button>' +
        '</div><div id="reviewList"></div></div>';
      app.innerHTML = html;
      renderReviewList();
      $$('.rtab[data-rf]').forEach(function (el) {
        el.onclick = function () { state.reviewFilter = el.getAttribute('data-rf'); saveState(); renderReview(); };
      });
      $('#btnBackResult').onclick = function () { state.screen = 'result'; saveState(); renderAll(); };
    }
    function renderReviewList() {
      var list = $('#reviewList');
      if (!list) return;
      var filter = state.reviewFilter || 'all';
      var html = '';
      for (var i = 0; i < state.questions.length; i++) {
        var q = state.questions[i];
        var ans = state.answers[q.id];
        var answered = isAnswered(q, ans);
        var correct = isCorrect(q, ans);
        var cls = !answered ? 'empty' : correct ? 'correct' : 'wrong';
        if (filter === 'correct' && !(answered && correct)) continue;
        if (filter === 'wrong' && !(answered && !correct)) continue;
        if (filter === 'empty' && answered) continue;
        var tag = !answered ? '<span class="rtag none">Kosong</span>' : correct ? '<span class="rtag ok">Benar</span>' : '<span class="rtag no">Salah</span>';
        html += '<div class="review-item ' + cls + '"><div class="rhead"><span class="rnum">Soal ' + (i + 1) + ' &bull; ' + catLabel(q.cat) + '</span>' + tag + '</div>' +
          '<div class="rq">' + esc(q.q) + '</div>';
        html += '<div class="rans">';
        html += '<div class="box you' + (answered && !correct ? ' wrong' : '') + '"><span class="lbl">Jawaban Anda</span>' + renderAnswerText(q, ans) + '</div>';
        html += '<div class="box key"><span class="lbl">Kunci</span>' + renderKeyText(q) + '</div>';
        html += '</div>';
        html += '<div class="expl"><b>Pembahasan:</b> ' + esc(q.exp || '-') + '</div>';
        html += '</div>';
      }
      if (!html) html = '<div class="no-data">Tidak ada soal pada filter ini.</div>';
      list.innerHTML = html;
    }
    function renderAnswerText(q, ans) {
      if (!isAnswered(q, ans)) return '<i>Belum dijawab</i>';
      if (q.type === 'single') return esc(q.opts[ans]);
      if (q.type === 'complex') return ans.slice().sort(function (a, b) { return a - b; }).map(function (i) { return esc(q.opts[i]); }).join('; ');
      if (q.type === 'bs') {
        var parts = [];
        for (var i = 0; i < q.stmts.length; i++) { parts.push((i + 1) + '. ' + (ans[i] === true ? 'Benar' : ans[i] === false ? 'Salah' : '-')); }
        return parts.join('<br>');
      }
      return '-';
    }
    function renderKeyText(q) {
      if (q.type === 'single') return esc(q.opts[q.ans]);
      if (q.type === 'complex') return q.ans.slice().sort(function (a, b) { return a - b; }).map(function (i) { return esc(q.opts[i]); }).join('; ');
      if (q.type === 'bs') {
        var parts = [];
        for (var i = 0; i < q.stmts.length; i++) { parts.push((i + 1) + '. ' + (q.ans[i] ? 'Benar' : 'Salah')); }
        return parts.join('<br>');
      }
      return '-';
    }

    /* ADMIN RENDER */
    function goAdmin() { state.screen = 'admin'; saveState(); renderAll(); }
    function goHome() { clearInterval(timerInterval); state.screen = 'start'; saveState(); renderAll(); }

    function renderAdmin() {
      var app = $('#app');
      var data = loadAdminData();
      var filtered = data.filter(function (r) {
        if (adminFilter !== 'all' && r.field !== adminFilter) return false;
        if (adminSearch) {
          var s = adminSearch.toLowerCase();
          if ((r.name || '').toLowerCase().indexOf(s) < 0) return false;
        }
        return true;
      }).slice().reverse();
      var html = '<div class="admin-hero"><div><h2>Panel Admin</h2><p>Riwayat hasil tryout peserta (tersimpan lokal di browser).</p></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" id="btnExport">Ekspor JSON</button>' +
        '<button class="btn btn-red btn-sm" id="btnClearAll">Hapus Semua</button></div></div>' +
        '<div class="admin-toolbar">' +
        '<input id="adminSearch" placeholder="Cari nama peserta..." value="' + esc(adminSearch) + '">' +
        '<select id="adminFilter" style="padding:10px 14px;border-radius:10px;border:1.5px solid var(--gray2);font-size:13px;background:#fff">' +
        '<option value="all"' + (adminFilter === 'all' ? ' selected' : '') + '>Semua Bidang</option>' +
        '<option value="Informatika"' + (adminFilter === 'Informatika' ? ' selected' : '') + '>Informatika</option>' +
        '<option value="IPA"' + (adminFilter === 'IPA' ? ' selected' : '') + '>IPA</option>' +
        '</select>' +
        '<button class="btn btn-outline btn-sm" id="btnRefresh">Muat Ulang</button>' +
        '<span style="font-size:12px;color:var(--muted);font-weight:600">Total: ' + filtered.length + ' data</span>' +
        '</div>';
      if (filtered.length === 0) {
        html += '<div class="admin-table-wrap"><div class="admin-empty"><span class="ic">📭</span>Belum ada data hasil tryout.<br>Data akan muncul setelah peserta menyelesaikan tryout.</div></div>';
      } else {
        html += '<div class="admin-table-wrap"><table class="admin"><thead><tr>' +
          '<th>Nama</th><th>Bidang</th><th>Skor</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>Durasi</th><th>Waktu</th><th>Aksi</th>' +
          '</tr></thead><tbody>';
        for (var i = 0; i < filtered.length; i++) {
          var r = filtered[i];
          var sc = r.score >= 80 ? 'ok' : r.score >= 60 ? 'mid' : 'bad';
          var fld = r.field === 'Informatika' ? 'inf' : 'ipa';
          var dur = fmtDuration(r.durationMs);
          var when = r.finishedAt ? new Date(r.finishedAt).toLocaleString('id-ID') : '-';
          html += '<tr>' +
            '<td>' + esc(r.name) + '</td>' +
            '<td><span class="tag-field ' + fld + '">' + esc(r.field) + '</span></td>' +
            '<td><span class="mini-score ' + sc + '">' + r.score + '</span></td>' +
            '<td>' + r.correct + '</td><td>' + r.wrong + '</td><td>' + r.empty + '</td>' +
            '<td>' + dur + '</td><td style="white-space:nowrap">' + when + '</td>' +
            '<td><div class="admin-actions">' +
            '<button class="btn btn-outline btn-xs" data-detail="' + r.id + '">Detail</button>' +
            '<button class="btn btn-red btn-xs" data-del="' + r.id + '">Hapus</button>' +
            '</div></td>' +
            '</tr>';
        }
        html += '</tbody></table></div>';
      }
      app.innerHTML = html;
      $('#adminSearch').oninput = function () { adminSearch = this.value; renderAdmin(); };
      $('#adminFilter').onchange = function () { adminFilter = this.value; renderAdmin(); };
      $('#btnRefresh').onclick = renderAdmin;
      $('#btnExport').onclick = function () {
        var blob = new Blob([JSON.stringify(loadAdminData(), null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'tryout_ukpppg_data.json';
        a.click();
      };
      $('#btnClearAll').onclick = function () {
        if (confirm('Hapus SEMUA data hasil tryout? Tindakan ini tidak dapat dibatalkan.')) {
          saveAdminData([]); renderAdmin(); showToast('Semua data dihapus.');
        }
      };
      $$('button[data-del]').forEach(function (el) {
        el.onclick = function () {
          if (confirm('Hapus data ini?')) { deleteAdminRecord(el.getAttribute('data-del')); renderAdmin(); showToast('Data dihapus.'); }
        };
      });
      $$('button[data-detail]').forEach(function (el) {
        el.onclick = function () { showDetail(el.getAttribute('data-detail')); };
      });
    }

    function showDetail(id) {
      var rec = loadAdminData().filter(function (r) { return r.id === id; })[0];
      if (!rec) return;
      var r = { correct: rec.correct, wrong: rec.wrong, empty: rec.empty, score: rec.score, byCat: rec.byCat };
      var html = '<div class="modal-back" id="modalBack"><div class="modal">' +
        '<div class="modal-head"><h3>Detail Hasil &ndash; ' + esc(rec.name) + '</h3><button class="btn btn-outline btn-xs" id="modalClose">Tutup</button></div>' +
        '<div class="modal-body">' +
        '<div class="detail-grid">' +
        '<div class="dbox"><div class="k">Bidang</div><div class="v">' + esc(rec.field) + '</div></div>' +
        '<div class="dbox"><div class="k">Skor</div><div class="v">' + rec.score + '</div></div>' +
        '<div class="dbox"><div class="k">Benar</div><div class="v">' + rec.correct + '</div></div>' +
        '<div class="dbox"><div class="k">Salah</div><div class="v">' + rec.wrong + '</div></div>' +
        '<div class="dbox"><div class="k">Kosong</div><div class="v">' + rec.empty + '</div></div>' +
        '<div class="dbox"><div class="k">Durasi</div><div class="v">' + fmtDuration(rec.durationMs) + '</div></div>' +
        '</div>' +
        '<h4>Analisis Kategori</h4>';
      var keys = Object.keys(r.byCat);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i], c = r.byCat[k];
        if (!c || c.total === 0) continue;
        var p = Math.round((c.correct / c.total) * 100);
        html += '<div class="mini-review"><div class="mr-head"><span>' + catLabel(k) + '</span><span>' + c.correct + '/' + c.total + ' (' + p + '%)</span></div><div class="bar"><i style="width:' + p + '%"></i></div></div>';
      }
      html += '<h4>Ringkasan Pembahasan</h4>';
      var qs = rec.questions || [];
      for (var j = 0; j < qs.length; j++) {
        var q = qs[j];
        var ans = (rec.answers || {})[q.id];
        var answered = isAnswered(q, ans);
        var correct = isCorrect(q, ans);
        var cls = !answered ? 'empty' : correct ? 'correct' : 'wrong';
        var tag = !answered ? 'Kosong' : correct ? 'Benar' : 'Salah';
        html += '<div class="mini-review ' + cls + '"><div class="mr-head"><span>Soal ' + (j + 1) + ' &bull; ' + catLabel(q.cat) + '</span><span>' + tag + '</span></div>' +
          '<div style="color:var(--muted);font-size:11.5px">' + esc((q.q || '').slice(0, 120)) + (q.q && q.q.length > 120 ? '...' : '') + '</div>' +
          '<div class="mr-ans">Jawaban Anda: ' + renderAnswerText(q, ans) + '</div>' +
          '<div class="mr-key">Kunci: ' + renderKeyText(q) + '</div>' +
          '<div class="mr-exp">' + esc(q.exp || '-') + '</div>' +
          '</div>';
      }
      html += '</div>' +
        '<div class="modal-foot"><button class="btn btn-outline" id="modalClose2">Tutup</button></div>' +
        '</div></div>';
      document.body.insertAdjacentHTML('beforeend', html);
      function close() { var m = $('#modalBack'); if (m) m.remove(); }
      $('#modalClose').onclick = close;
      $('#modalClose2').onclick = close;
      $('#modalBack').onclick = function (e) { if (e.target.id === 'modalBack') close(); };
    }

    /* MAIN RENDER */
    function renderAll() {
      renderHeader();
      if (state.screen === 'start') renderStart();
      else if (state.screen === 'exam') renderExam();
      else if (state.screen === 'result') renderResult();
      else if (state.screen === 'review') renderReview();
      else if (state.screen === 'admin') renderAdmin();
    }

    /* Ikon admin tersembunyi */
    (function () {
      var el = document.getElementById('adminSecret');
      if (el) { el.onclick = function () { goAdmin(); }; }
    })();

    /* INIT */
    (function init() {
      var loaded = loadState();
      if (loaded && state.screen === 'exam' && state.endAt) {
        if (state.endAt <= Date.now()) { submitExam(true); }
        else { renderAll(); startTimer(); }
      } else if (loaded && (state.screen === 'result' || state.screen === 'review')) {
        renderAll();
      } else {
        state.screen = 'start';
        renderAll();
      }
    })();
  </script>
</body>

</html>
